<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photographe football — Portfolio</title>
  <meta name="description" content="Portfolio de photographie football : matchs, séances joueurs et visuels matchday.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#travaux">Aller aux photos</a>

  <header class="nav" id="nav">
    <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false"><span></span><span></span></button>
    <a href="#top" class="logo" data-fill="nom"></a>
    <a href="contact.html" class="nav-cta">Contact</a>
  </header>

  <div class="menu" id="menu" hidden>
    <nav>
      <a href="#travaux" data-close>Photos</a>
      <span id="menu-cats"></span>
      <a href="#services" data-close>Services</a>
      <a href="apropos.html">À propos</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="menu-foot" id="menu-socials"></div>
  </div>

  <main id="top">
    <!-- CARROUSEL -->
    <section class="reel" aria-label="Photos à la une">
      <div class="reel-track" id="reel"></div>
      <button class="reel-btn prev" id="reel-prev" aria-label="Photos précédentes">←</button>
      <button class="reel-btn next" id="reel-next" aria-label="Photos suivantes">→</button>
    </section>

    <!-- INTRO -->
    <section class="band band-mustard intro">
      <svg class="pitch" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3"><rect x="20" y="20" width="1160" height="560"/><line x1="600" y1="20" x2="600" y2="580"/><circle cx="600" cy="300" r="95"/><circle cx="600" cy="300" r="5" fill="currentColor"/><rect x="20" y="150" width="170" height="300"/><rect x="20" y="230" width="60" height="140"/><rect x="1010" y="150" width="170" height="300"/><rect x="1120" y="230" width="60" height="140"/><path d="M190 240 A80 80 0 0 1 190 360"/><path d="M1010 240 A80 80 0 0 0 1010 360"/></g></svg>
      <h1><a href="#travaux" data-fill="accroche"></a></h1>
      <p><a href="#travaux" class="btn">Voir les derniers matchs →</a></p>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-in" id="marquee1"></div></div>

    <!-- TRAVAUX -->
    <section class="works" id="travaux">
      <div class="works-head">
        <h2>Les <span class="outline">matchs</span></h2>
        <div class="filters" id="filters"></div>
      </div>
      <div class="feed" id="feed"></div>
    </section>

    <!-- SERVICES -->
    <section class="band band-dark services-wrap" id="services">
      <h2>Le <span class="outline">programme</span></h2>
      <ol class="services" id="services-list"></ol>
    </section>

    <!-- À PROPOS -->
    <section class="band band-blue about" id="apropos">
      <div class="about-photo" id="about-photo"></div>
      <div class="about-text">
        <p class="kicker" data-fill="metier"></p>
        <h2 data-fill="nom"></h2>
        <div id="about-text"></div>
        <dl class="stats" id="stats"></dl>
        <a href="apropos.html" class="btn about-more">Mon parcours complet →</a>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="cta" id="contact">
      <div class="cta-photo" id="cta-photo"></div>
      <div class="cta-box">
        <h2>Un match à couvrir&nbsp;?</h2>
        <p>Joueurs, agents, clubs : écris-moi, je réponds sous 24h.</p>
        <a href="contact.html" class="btn btn-big cta-btn">Me contacter →</a>
        <div class="contact-links" id="contact-links"></div>
      </div>
    </section>

    <div class="marquee marquee-alt" aria-hidden="true"><div class="marquee-in" id="marquee2"></div></div>
  </main>

  <footer class="footer">
    <span class="footer-logo" data-fill="nom"></span>
    <span class="socials" id="socials"></span>
    <span class="small">© <span id="year"></span> — Tous droits réservés sur les images.</span>
  </footer>

  <!-- ALBUM -->
  <div class="album-view" id="album-view" hidden>
    <div class="album-bar">
      <button class="icon-btn" id="album-close" aria-label="Fermer l'album">←</button>
      <div>
        <h3 id="album-title"></h3>
        <p id="album-meta"></p>
      </div>
    </div>
    <div class="masonry" id="album-photos"></div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="icon-btn lb-close" id="lb-close" aria-label="Fermer">✕</button>
    <button class="icon-btn lb-prev" id="lb-prev" aria-label="Photo précédente">←</button>
    <div class="lb-stage" id="lb-stage"></div>
    <button class="icon-btn lb-next" id="lb-next" aria-label="Photo suivante">→</button>
    <p class="lb-count" id="lb-count"></p>
  </div>

  <script src="js/data.js"></script>
  <script src="js/social.js"></script>
  <script src="js/albums.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
